# nginx для flystretch.ru
#
# Установка:
#   cp deploy/nginx/flystretch.conf /etc/nginx/sites-available/flystretch
#   ln -sf /etc/nginx/sites-available/flystretch /etc/nginx/sites-enabled/flystretch
#   nginx -t && systemctl reload nginx
#
# Сертификаты выпускаются certbot; строки, помеченные "managed by Certbot",
# им же и переписываются при обновлении.

server {
    server_name flystretch.ru www.flystretch.ru;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /FlyStretch {
        return 302 https://flystretch.ru/;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/flystretch.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/flystretch.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.flystretch.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = flystretch.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    # Запросы по IP-адресу сервера (без доменного Host) — редирект на домен,
    # иначе certbot-заглушка отдаёт 404.
    if ($host = 185.43.5.115) {
        return 301 https://flystretch.ru$request_uri;
    }

    listen 80 default_server;
    server_name flystretch.ru www.flystretch.ru _;
    return 404; # managed by Certbot
}
